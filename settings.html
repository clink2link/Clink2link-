<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings • Click2Pay</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/premium-unified.css"></head><body><main class="c2p-shell"><div class="c2p-card" style="padding:30px;max-width:760px;margin:30px auto"><span class="c2p-badge">Click2Pay</span><h1>Settings</h1><p class="c2p-muted">Manage your account, security, appearance and language.</p><section class="c2p-section"><h2>Appearance</h2><label style="display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--c2p-border)"><span><b>Dark Mode</b><small class="c2p-muted" style="display:block">Use a dark interface</small></span><input id="themeToggle" type="checkbox" style="width:22px;height:22px"></label><div style="padding:18px 0"><b>Language</b><div class="c2p-lang-menu" style="margin-top:12px"><button class="c2p-btn" data-lang="en">English</button><button class="c2p-btn" data-lang="id">Indonesia</button></div></div></section><section class="c2p-section"><h2>Security</h2><form id="passwordForm" style="display:grid;gap:12px"><input id="newPassword" type="password" minlength="8" placeholder="New password" required><input id="confirmPassword" type="password" minlength="8" placeholder="Confirm password" required><button class="c2p-btn" style="background:linear-gradient(135deg,var(--c2p-primary),var(--c2p-primary2));color:#fff">Change Password</button></form></section><section class="c2p-section"><h2>Account Management</h2><div style="display:grid;gap:12px"><button id="addAccountBtn" class="c2p-btn">Add Account</button><button id="switchAccountBtn" class="c2p-btn">Switch Account</button><button id="deleteAccountBtn" class="c2p-btn" style="background:#fee2e2;color:#991b1b">Delete Account</button><button id="logoutBtn" class="c2p-btn">Logout</button></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/database.js"></script><script src="/js/settings-pro.js"></script><script src="/js/c2p-core.js"></script></body></html>
