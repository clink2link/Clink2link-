<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Reset Password - Click2Pay</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/register.css">
<link rel="stylesheet" href="css/theme.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/unified.css">
<link rel="stylesheet" href="/css/premium-unified.css">
<link rel="stylesheet" href="/css/pro-premium.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
</head>

<body>

<div class="register-bg"></div>

<div class="register-container">

<div class="register-card">

<div class="register-logo">
<i class="fa-solid fa-lock-open"></i>
<h1>CLICK<span>2PAY</span></h1>
</div>

<div class="register-title">
<h2>Reset Password</h2>
<p>Enter password new for account Click2Pay you.</p>
</div>

<form id="resetForm">

<label>
<i class="fa-solid fa-lock"></i>
Password New
</label>

<div class="input-box password-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="New password"
autocomplete="new-password"
required>

<button
type="button"
class="toggle-password"
data-target="password">

<i class="fa-solid fa-eye"></i>

</button>

</div>

<label>
<i class="fa-solid fa-lock"></i>
Confirm Password
</label>

<div class="input-box password-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Repeat password"
autocomplete="new-password"
required>

<button
type="button"
class="toggle-password"
data-target="confirmPassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

<button
type="submit"
class="register-btn">

<i class="fa-solid fa-check"></i>

<span>Save Password</span>

</button>

</form>

<div class="register-links">

<p>

<a href="login.html">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</a>

</p>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/database.js"></script>
<script src="js/theme.js"></script>
<script src="js/reset-password.js"></script>
<script src="assets/js/debug.js"></script>
<script src="/js/c2p-core.js"></script>
<script src="/js/pro-ui.js"></script>
</body>
</html>
