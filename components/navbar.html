<!-- =====================================================
     LANGUAGE SELECTOR
===================================================== -->
<script>
document.addEventListener(
  "DOMContentLoaded",
  function(){
    const languageSelect =
      document.getElementById(
        "languageSelect"
      );
    /*
     * Stop if selector does not exist.
     */
    if(!languageSelect){
      return;
    }
    /*
     * Get saved language.
     *
     * Default:
     * Indonesian
     */
    const currentLanguage =
      localStorage.getItem(
        "language"
      ) || "id";
    /*
     * Set current language
     * inside selector.
     */
    languageSelect.value =
      currentLanguage;
    /*
     * Change language.
     */
    languageSelect.addEventListener(
      "change",
      function(){
        const selectedLanguage =
          this.value;
        /*
         * Save selected language.
         */
        localStorage.setItem(
          "language",
          selectedLanguage
        );
        /*
         * Apply translation
         * immediately if language.js
         * is already loaded.
         */
        if(
          typeof applyLanguage ===
          "function"
        ){
          applyLanguage(
            selectedLanguage
          );
        }
      }
    );
  }
);
</script>
