<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Click2Pay - Get Link</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",sans-serif;
}


body{

    background:#f4f8ff;
    color:#111827;
    min-height:100vh;

}


.container{

    width:min(900px,92%);
    margin:auto;

}


/* HEADER */

header{

    padding:20px 0;
    background:white;
    border-bottom:1px solid #e5e7eb;

}


.logo{

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    font-size:26px;
    font-weight:800;
    color:#2563eb;

}



/* MAIN */

.main{

    padding:50px 0;

}


.card{

    background:white;
    border-radius:24px;
    padding:35px;

    box-shadow:
    0 20px 50px rgba(37,99,235,.12);

    text-align:center;

}



.title{

    font-size:32px;
    font-weight:800;
    color:#2563eb;
    margin-bottom:15px;

}


.desc{

    color:#64748b;
    margin-bottom:30px;

}



/* BUTTON */


.btn{

    border:none;
    cursor:pointer;

    padding:15px 30px;

    border-radius:14px;

    font-size:16px;
    font-weight:700;

    transition:.25s;

}


.btn-primary{

    background:#2563eb;
    color:white;

}


.btn-primary:hover{

    background:#1d4ed8;
    transform:translateY(-2px);

}



.btn-success{

    background:#22c55e;
    color:white;

}


/* LOADING */


.loading{

    display:none;

    margin-top:30px;

}


.spinner{

    width:45px;
    height:45px;

    border-radius:50%;

    border:5px solid #dbeafe;
    border-top-color:#2563eb;

    animation:spin 1s linear infinite;

    margin:auto;

}



@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}



/* LINK PANEL */


.link-panel{

    display:none;

    margin-top:35px;

    padding:25px;

    border-radius:20px;

    background:#f8fafc;

    border:1px solid #dbeafe;

}



.ad-box{

    min-height:120px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#fff;

    border-radius:15px;

    margin:15px 0;

}



/* GET LINK */


.get-area{

    margin:25px 0;

}



.progress{

    display:none;

    height:18px;

    width:100%;

    background:#dbeafe;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar{

    width:0%;

    height:100%;

    background:linear-gradient(
    90deg,
    #2563eb,
    #60a5fa
    );

    transition:.2s;

}



.status{

    margin-top:15px;

    font-weight:700;

    color:#2563eb;

}



/* OPEN LINK */


.open-btn{

    display:none;

}



@media(max-width:600px){

.card{

    padding:25px;

}


.title{

    font-size:26px;

}


.btn{

    width:100%;

}

}



</style>

</head>


<body>


<header>

<div class="logo">

<i class="fa-solid fa-link"></i>

<span>Click2Pay</span>

</div>

</header>



<section class="main">


<div class="container">


<div class="card">


<h1 class="title">

Download Link

</h1>


<p class="desc">

Selesaikan proses untuk mendapatkan link tujuan.

</p>



<button id="downloadBtn" class="btn btn-primary">

<i class="fa-solid fa-download"></i>

Download Link

</button>



<div id="loading" class="loading">


<div class="spinner"></div>


<p id="loadingText">

Memproses...

</p>


</div>



<div id="linkPanel" class="link-panel">


<div class="ad-box">

<!-- ADSTERRA ATAS -->

</div>



<div class="get-area">


<button id="getBtn" class="btn btn-primary">

<i class="fa-solid fa-link"></i>

Get Link

</button>


<div id="progress" class="progress">


<div id="progressBar" class="progress-bar"></div>


</div>


<p id="status" class="status"></p>


</div>



<div class="ad-box">

<!-- ADSTERRA BAWAH -->

</div>



<button id="openBtn" class="btn btn-success open-btn">

<i class="fa-solid fa-arrow-right"></i>

Open Link

</button>


</div>



</div>


</div>


</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lwjtagxkqeprjpupmadf.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJsbXdqZ3hrcWVwcmpwdXBtYWRmIiwicmVmIjoibHdqdGFn eHhrcWVwcmpwdXBtYWRmIiwicm9sIjoiYW5vbiIsImlhdCI6MTc4NDMwMTE3NiwiZXhwIjoyMDk5ODc3MTc2fQ.Cg8TIBtOE4PHmnSybJtMqEoCFx-Qm4Kkl8exSOanTes";
const supabaseClient=supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
// =====================================================
// GET CODE
// =====================================================
let code=new URLSearchParams(location.search).get("code");
if(!code){
    code=localStorage.getItem("task_code");
}
console.log("FINAL CODE:",code);
// =====================================================
// ELEMENT
// =====================================================
const downloadBtn=document.getElementById("downloadBtn");
const loading=document.getElementById("loading");
const loadingText=document.getElementById("loadingText");
const linkPanel=document.getElementById("linkPanel");
const getBtn=document.getElementById("getBtn");
const progress=document.getElementById("progress");
const progressBar=document.getElementById("progressBar");
const status=document.getElementById("status");
const openBtn=document.getElementById("openBtn");
// =====================================================
// CODE CHECK
// =====================================================
if(!code){
    downloadBtn.disabled=true;
    status.innerHTML="Kode link tidak ditemukan.";
}
// =====================================================
// DOWNLOAD 5 DETIK
// =====================================================
downloadBtn.onclick=()=>{
    downloadBtn.style.display="none";
    loading.style.display="block";
    let s=5;
    loadingText.innerHTML=
        "Menyiapkan link "+s+" detik";
    const timer=setInterval(()=>{
        s--;
        loadingText.innerHTML=
            "Menyiapkan link "+s+" detik";
        if(s<=0){
            clearInterval(timer);
            loading.style.display="none";
            linkPanel.style.display="block";
            status.innerHTML=
                "Silahkan klik Get Link";
        }
    },1000);
};
// =====================================================
// GET LINK 3 DETIK
// =====================================================
getBtn.onclick=()=>{
    getBtn.style.display="none";
    progress.style.display="block";
    let p=0;
    const timer=setInterval(()=>{
        p++;
        progressBar.style.width=p+"%";
        status.innerHTML=
            "Memproses "+p+"%";
        if(p>=100){
            clearInterval(timer);
            status.innerHTML=
                "Link berhasil dibuat";
            openBtn.style.display="inline-block";
        }
    },30);
};
// =====================================================
// OPEN LINK
// =====================================================
openBtn.onclick=async()=>{
try{
    // =================================================
    // VALIDASI CODE
    // =================================================
    if(!code){
        alert("Kode tidak valid");
        return;
    }
    // =================================================
    // AMBIL LINK
    // =================================================
    const {
        data:link,
        error:linkError
    }=await supabaseClient
        .from("links")
        .select("*")
        .eq(
            "short_code",
            String(code)
        )
        .maybeSingle();
    if(linkError){
        console.error(
            "GET LINK ERROR:",
            linkError
        );
        alert("Gagal mengambil link");
        return;
    }
    if(!link){
        alert("Link tidak ditemukan");
        return;
    }
    // =================================================
    // STATUS LINK
    // =================================================
    if(link.status!=="active"){
        alert("Link sudah tidak aktif");
        return;
    }
    // =================================================
    // ANTI DOUBLE VIEW
    // =================================================
    const viewedKey=
        "view_"+code;
    const viewed=
        localStorage.getItem(viewedKey);
    if(viewed){
        window.location.href=
            link.destination_url;
        return;
    }
    // Tandai sudah dihitung
    localStorage.setItem(
        viewedKey,
        "true"
    );
    // =================================================
    // CPM
    // =================================================
    let earning=75;
    const {
        data:cpmData,
        error:cpmError
    }=await supabaseClient
        .from("cpm_rates")
        .select("cpm")
        .eq(
            "country",
            "Indonesia"
        )
        .maybeSingle();
    if(cpmError){
        console.log(
            "CPM ERROR:",
            cpmError
        );
    }
    if(cpmData){
        earning=
            Number(cpmData.cpm||75);
    }
    console.log(
        "EARNING:",
        earning
    );
    // =================================================
    // UPDATE LINKS
    // =================================================
    const {
        error:updateLinkError
    }=await supabaseClient
        .from("links")
        .update({
            views:
                Number(link.views||0)+1,
            total_views:
                Number(link.total_views||0)+1,
            total_earnings:
                Number(link.total_earnings||0)+earning
        })
        .eq(
            "id",
            link.id
        );
    if(updateLinkError){
        console.error(
            "UPDATE LINKS ERROR:",
            updateLinkError
        );
    }
    // =================================================
    // SIMPAN LINK VIEW
    // =================================================
    const {
        error:viewError
    }=await supabaseClient
        .from("link_views")
        .insert({
            link_id:
                link.id,
            earning:
                earning,
            is_valid:
                true,
            created_at:
                new Date().toISOString()
        });
    if(viewError){
        console.error(
            "LINK VIEWS ERROR:",
            viewError
        );
    }
    // =================================================
    // UPDATE USERS
    // =================================================
    const {
        data:user,
        error:userError
    }=await supabaseClient
        .from("users")
        .select(`
            id,
            balance,
            ads_earning_today,
            ads_earning_month,
            ads_earning_total,
            total_views,
            total_clicks
        `)
        .eq(
            "id",
            link.user_id
        )
        .maybeSingle();
    if(userError){
        console.error(
            "GET USER ERROR:",
            userError
        );
    }
    if(user){
        const {
            error:userUpdateError
        }=await supabaseClient
            .from("users")
            .update({
                balance:
                    Number(user.balance||0)
                    + earning,
                ads_earning_today:
                    Number(
                        user.ads_earning_today||0
                    )
                    + earning,
                ads_earning_month:
                    Number(
                        user.ads_earning_month||0
                    )
                    + earning,
                ads_earning_total:
                    Number(
                        user.ads_earning_total||0
                    )
                    + earning,
                total_views:
                    Number(
                        user.total_views||0
                    )
                    + 1,
                total_clicks:
                    Number(
                        user.total_clicks||0
                    )
                    + 1
            })
            .eq(
                "id",
                link.user_id
            );
        if(userUpdateError){
            console.error(
                "USER UPDATE ERROR:",
                userUpdateError
            );
        }
    }
    // =================================================
    // DAILY REPORT
    // ASIA/JAKARTA
    // =================================================
    const todayDate=
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    "Asia/Jakarta"
            }
        ).format(
            new Date()
        );
    console.log(
        "REPORT DATE:",
        todayDate
    );
    // =================================================
    // CEK DAILY REPORT
    // =================================================
    const {
        data:report,
        error:reportSelectError
    }=await supabaseClient
        .from("daily_reports")
        .select("*")
        .eq(
            "user_id",
            link.user_id
        )
        .eq(
            "report_date",
            todayDate
        )
        .maybeSingle();
    if(reportSelectError){
        console.error(
            "REPORT SELECT ERROR:",
            reportSelectError
        );
    }
    // =================================================
    // UPDATE REPORT
    // =================================================
    if(report){
        const {
            error:reportUpdateError
        }=await supabaseClient
            .from("daily_reports")
            .update({
                ads_views:
                    Number(
                        report.ads_views||0
                    )
                    + 1,
                ads_earnings:
                    Number(
                        report.ads_earnings||0
                    )
                    + earning
            })
            .eq(
                "id",
                report.id
            );
        if(reportUpdateError){
            console.error(
                "REPORT UPDATE ERROR:",
                reportUpdateError
            );
        }
    }
    // =================================================
    // INSERT REPORT
    // =================================================
    else{
        const {
            error:reportInsertError
        }=await supabaseClient
            .from("daily_reports")
            .insert({
                user_id:
                    link.user_id,
                report_date:
                    todayDate,
                ads_views:
                    1,
                ads_clicks:
                    0,
                ads_earnings:
                    earning,
                sell_views:
                    0,
                sell_clicks:
                    0,
                sell_earnings:
                    0
            });
        if(reportInsertError){
            console.error(
                "REPORT INSERT ERROR:",
                reportInsertError
            );
        }
    }
    // =================================================
    // REDIRECT
    // =================================================
    window.location.href=
        link.destination_url;
}catch(err){
    console.error(
        "FINAL ERROR:",
        err
    );
    alert(
        "Terjadi kesalahan. Silakan coba lagi."
    );
}
};
</script>

</body>
</html>
