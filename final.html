<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preparing your link • Click2Pay</title>
<script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pro-premium.css">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="shortcut icon" href="/favicon.ico">
</head>
<body class="app-body">
<div class="app-bg"></div>
<main class="c2p-shell" style="min-height:100vh;display:grid;place-items:center">
<section class="c2p-card" style="width:min(620px,100%);padding:34px;text-align:center">
  <span class="c2p-badge"><i class="fa-solid fa-link"></i> CLICK2PAY</span>
  <h1 style="font-size:clamp(2rem,6vw,3.5rem);margin:18px 0 8px">Your link is <span class="c2p-gradient">ready</span></h1>
  <p id="status" class="c2p-muted">Preparing your destination securely.</p>
  <div id="progress" style="height:10px;background:rgba(148,163,184,.16);border-radius:999px;overflow:hidden;margin:24px 0"><div id="progressBar" style="height:100%;width:0;background:linear-gradient(90deg,var(--pro-primary),var(--pro-primary-2));transition:width .2s"></div></div>
  <button id="openBtn" class="c2p-btn" style="width:100%;max-width:360px"><i class="fa-solid fa-arrow-up-right-from-square"></i> Continue to destination</button>
  <p class="c2p-muted" style="font-size:12px;margin-top:16px">Your view is verified server-side. Repeated refreshes are not counted as new earnings.</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/database.js"></script><script src="/js/c2p-core.js"></script><script src="/js/pro-ui.js"></script>
<script>
'use strict';
(async()=>{
 const code=new URLSearchParams(location.search).get('code')||localStorage.getItem('task_code')||'';
 const status=document.getElementById('status'),bar=document.getElementById('progressBar'),btn=document.getElementById('openBtn');
 if(!code){status.textContent='Link code not found.';btn.disabled=true;return;}
 let link=null;
 try{link=await window.database.getLinkByCode(code);}catch(e){console.error(e)}
 if(!link){status.textContent='This link could not be found.';btn.disabled=true;return;}
 if(String(link.status||'').toLowerCase()!=='active'){status.textContent='This link is no longer active.';btn.disabled=true;return;}
 const type=String(link.link_type||link.type||'').toLowerCase();
 if(type!=='ads'){status.textContent='This is not an Ads Link.';btn.disabled=true;return;}
 const destination=link.destination_url||link.destination;
 let destinationUrl;try{destinationUrl=new URL(destination,location.origin)}catch{destinationUrl=null}
 if(!destinationUrl||!['http:','https:'].includes(destinationUrl.protocol)){status.textContent='The destination URL is invalid.';btn.disabled=true;return;}
 let n=0;const timer=setInterval(()=>{n=Math.min(100,n+2);bar.style.width=n+'%';if(n>=100){clearInterval(timer);status.textContent='Ready. Click continue to open the destination.';}},40);
 btn.onclick=async()=>{
   if(btn.disabled)return;btn.disabled=true;status.textContent='Verifying your view securely...';bar.style.width='100%';
   try{
     const r=await fetch('/api/ads/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link_id:link.id})});
     const d=await r.json().catch(()=>({}));
     if(!r.ok||d.success===false){
       if(d.duplicate){status.textContent='This view was already counted recently. Opening the destination...';setTimeout(()=>location.replace(destinationUrl.href),500);return;}
       throw new Error(d.error||'Unable to verify this view.');
     }
     status.textContent=`View verified${d.earning?` • Rp ${Number(d.earning).toLocaleString('id-ID')} credited`:''}. Opening destination...`;
     sessionStorage.setItem('ads_view_'+link.id,'1');
     setTimeout(()=>location.replace(destinationUrl.href),650);
   }catch(e){console.error(e);btn.disabled=false;status.textContent=e.message||'Verification failed. Please try again.';}
 };
})();
</script>
</body></html>
