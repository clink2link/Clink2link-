<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Edit Profilee • Click2Pay</title>

<script>
if(localStorage.getItem("theme")==="dark"){
document.documentElement.classList.add("dark");
}
</script>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/edit-profile.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/unified.css">
</head>

<body class="app-body">

<div class="app-bg"></div>

<div id="navbar"></div> <!-- TAMBAHAN -->

<div class="app-container">

<section class="page-title">
<i class="fa-solid fa-user"></i>
<div>
<h1>Edit Profilee</h1>
<p>Update your Click2Pay account information.</p>
</div>
</section>


<section class="edit-card">

<div class="edit-header">

<div class="edit-icon">
<i class="fa-solid fa-user-pen"></i>
</div>

<div>
<h2>Edit Username</h2>
<p>Perbarui name users account Click2Pay you.</p>
</div>

</div>


<div class="edit-form">

<label>
New Username
</label>


<div class="input-box">

<i class="fa-solid fa-at"></i>

<input
id="editUsername"
type="text"
placeholder="Enter a new username">

</div>


<button
id="saveProfilee"
class="btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

Save Changes

</button>


<div id="editResult"></div>


</div>

</section>



<section class="info-note">

<i class="fa-solid fa-shield-halved"></i>

<div>

<h3>Username Information</h3>

<p>
Your username identifies your Click2Pay account. Use a unique and memorable username. Changes are saved automatically.
</p>

</div>

</section>


</main>
</div> <!-- TAMBAHAN (nutup app-container) -->

<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/database.js"></script>
<script src="js/session.js"></script>
<script src="js/theme.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/edit-profile.js"></script>

<script src="assets/js/debug.js"></script>


<script>

fetch("components/navbar.html")
.then(res=>res.text())
.then(html=>{
document.getElementById("navbar").innerHTML=html;

if(typeof c2pInit==="function")
c2pInit();
});


fetch("components/footer.html")
.then(res=>res.text())
.then(html=>{
document.getElementById("footer").innerHTML=html;

if(typeof c2pFooterInit==="function")
c2pFooterInit();
});

</script>


</body>
</html>
