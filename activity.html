<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aktivitas Login - Click2Pay</title>
<!-- =========================
     INITIAL THEME
========================= -->
<script>
(function(){
    const theme = localStorage.getItem("theme");
    if(theme === "dark"){
        document.documentElement.classList.add("dark");
    }
})();
</script>
<!-- =========================
     FONT
========================= -->
<link rel="preconnect"
      href="https://fonts.googleapis.com">
<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">
<!-- =========================
     ICON
========================= -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<!-- =========================
     CSS
========================= -->
<link rel="stylesheet"
      href="css/theme.css">
<link rel="stylesheet"
      href="css/navbar.css">
<link rel="stylesheet"
      href="css/activity.css">
</head>
<body class="app-body">
<!-- =========================
     NAVBAR
========================= -->
<div id="navbar"></div>
<!-- =========================
     MAIN
========================= -->
<main class="container">
<!-- =========================
     PAGE TITLE
========================= -->
<div class="page-title">
    <h1>
        <i class="fa-solid fa-user-clock"></i>
        <span data-i18n="loginActivity">
            Aktivitas Login
        </span>
    </h1>
    <p data-i18n="loginActivityDescription">
        Riwayat perangkat dan waktu login akun kamu.
    </p>
</div>
<!-- =========================
     LOGIN SUMMARY
========================= -->
<div class="payment-grid">
    <!-- TOTAL DEVICE -->
    <div class="pay-card">
        <div class="card-icon blue">
            <i class="fa-solid fa-right-to-bracket"></i>
        </div>
        <span data-i18n="totalDevice">
            Total Device
        </span>
        <h2 id="totalLogin">
            0
        </h2>
    </div>
    <!-- LAST LOGIN -->
    <div class="pay-card">
        <div class="card-icon green">
            <i class="fa-solid fa-clock"></i>
        </div>
        <span data-i18n="lastLogin">
            Login Terakhir
        </span>
        <h2 id="lastLogin">
            -
        </h2>
    </div>
    <!-- CURRENT DEVICE -->
    <div class="pay-card">
        <div class="card-icon purple">
            <i class="fa-solid fa-laptop"></i>
        </div>
        <span data-i18n="currentDevice">
            Device Sekarang
        </span>
        <h2 id="lastDevice">
            -
        </h2>
    </div>
</div>
<!-- =========================
     LOGIN DEVICE LIST
========================= -->
<div class="info-box">
    <div class="info-header">
        <i class="fa-solid fa-list"></i>
        <h3 data-i18n="loginDevices">
            Perangkat Login
        </h3>
    </div>
    <div id="loginList"
         class="info-list"
         data-i18n="loadingData">
        Memuat data...
    </div>
</div>
</main>
<!-- =========================
     LIBRARIES
========================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- =========================
     DATABASE
========================= -->
<script src="js/database.js"></script>
<!-- =========================
     ACTIVITY
========================= -->
<script src="js/activity.js"></script>
<!-- =========================
     SESSION
========================= -->
<script src="js/session.js"></script>
<!-- =========================
     THEME
========================= -->
<script src="js/theme.js"></script>
<!-- =========================
     LANGUAGE
========================= -->
<script src="js/language.js"></script>
<!-- =====================================================
     NAVBAR LOAD
===================================================== -->
<script>
document.addEventListener(
    "DOMContentLoaded",
    function(){
        fetch("components/navbar.html")
            .then(function(response){
                if(!response.ok){
                    throw new Error(
                        "Gagal memuat navbar: " +
                        response.status
                    );
                }
                return response.text();
            })
            .then(function(html){
                const navbar =
                    document.getElementById("navbar");
                if(!navbar){
                    console.error(
                        "ELEMENT #navbar TIDAK DITEMUKAN"
                    );
                    return;
                }
                /* =========================
                   INSERT NAVBAR
                ========================= */
                navbar.innerHTML = html;
                console.log(
                    "NAVBAR HTML LOADED"
                );
                /* =========================
                   LOAD NAVBAR JS
                ========================= */
                const script =
                    document.createElement("script");
                script.src =
                    "js/navbar.js";
                script.onload =
                    function(){
                        console.log(
                            "NAVBAR JS READY"
                        );
                        /* =========================
                           INIT NAVBAR
                        ========================= */
                        if(
                            typeof c2pInit ===
                            "function"
                        ){
                            c2pInit();
                        }
                        /* =========================
                           REFRESH LANGUAGE
                        ========================= */
                        if(
                            window.c2pLanguage &&
                            typeof c2pLanguage.refreshLanguage ===
                            "function"
                        ){
                            c2pLanguage.refreshLanguage();
                            console.log(
                                "NAVBAR LANGUAGE REFRESHED"
                            );
                        }
                        /* =========================
                           CLOSE SIDEBAR
                        ========================= */
                        document
                            .querySelectorAll(
                                ".c2p-sidebar a"
                            )
                            .forEach(
                                function(link){
                                    link.addEventListener(
                                        "click",
                                        function(){
                                            if(
                                                typeof c2pClose ===
                                                "function"
                                            ){
                                                c2pClose();
                                            }
                                        }
                                    );
                                }
                            );
                        /* =========================
                           LOGOUT
                        ========================= */
                        const logoutBtn =
                            document.getElementById(
                                "logoutBtn"
                            );
                        if(logoutBtn){
                            logoutBtn.addEventListener(
                                "click",
                                async function(){
                                    try{
                                        if(
                                            window.database &&
                                            typeof database.logout ===
                                            "function"
                                        ){
                                            await database.logout();
                                        }
                                    }catch(error){
                                        console.error(
                                            "LOGOUT ERROR:",
                                            error
                                        );
                                    }
                                    localStorage.clear();
                                    sessionStorage.clear();
                                    window.location.replace(
                                        "index.html"
                                    );
                                }
                            );
                        }
                    };
                /* =========================
                   NAVBAR LOAD ERROR
                ========================= */
                script.onerror =
                    function(){
                        console.error(
                            "GAGAL LOAD js/navbar.js"
                        );
                    };
                document.body.appendChild(
                    script
                );
            })
            .catch(function(error){
                console.error(
                    "NAVBAR LOAD ERROR:",
                    error
                );
            });
    }
);
</script>
<!-- =========================
     DEBUG
========================= -->
<script src="assets/js/debug.js"></script>
</body>
</html>
