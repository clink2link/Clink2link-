<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ads • Click2Pay</title>


<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app-ui.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

body{
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.ads-loader{

text-align:center;
padding:40px;

background:rgba(255,255,255,.08);
border-radius:20px;

backdrop-filter:blur(15px);

}


.spinner{

width:45px;
height:45px;

border:4px solid #ddd;
border-top-color:#2563eb;

border-radius:50%;

animation:spin 1s linear infinite;

margin:auto auto 20px;

}


@keyframes spin{

to{
transform:rotate(360deg);
}

}


</style>

</head>


<body class="app-body">


<div class="ads-loader">


<div class="spinner"></div>


<h2>
<i class="fa-solid fa-bullhorn"></i>
Memuat Iklan
</h2>


<p id="status">
Memeriksa link...
</p>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/database.js"></script>



<script>


document.addEventListener(
"DOMContentLoaded",
async()=>{


try{


let path =
location.pathname;



/*
Ambil kode dari URL

contoh:

/ads/83935e6b

hasil:
83935e6b

*/

let code =
path.split("/")[2];



console.log(
"ADS CODE:",
code
);



if(!code){


document.getElementById("status").innerHTML=
"Kode iklan tidak ditemukan";


return;

}




let link =
await database.getLinkByCode(code);



console.log(
"ADS DATA:",
link
);




if(!link){


document.getElementById("status").innerHTML=
"Link iklan tidak ditemukan";


return;


}





if(
link.type!=="ads" &&
link.link_type!=="ads"
){


document.getElementById("status").innerHTML=
"Link ini bukan iklan";


return;


}





document.getElementById("status").innerHTML=
"Iklan ditemukan, membuka Task 1...";




/*
Redirect ke task1

contoh:

task1.html?code=83935e6b

*/

setTimeout(()=>{


location.href =
"task1.html?code="+code;



},1000);





}catch(error){


console.error(
"ADS ERROR:",
error
);


document.getElementById("status").innerHTML=
"Terjadi kesalahan";


}



});


</script>


</body>

</html>
